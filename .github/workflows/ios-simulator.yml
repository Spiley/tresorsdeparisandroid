name: iOS simulator

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/TresorsDeParis.xcodeproj -scheme TresorsDeParis \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log || {
            # Surface compiler errors as annotations on the run page
            grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Boot simulator, install and launch
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")])
          print(next(d["udid"] for d in devices[ios[-1]] if d["name"].startswith("iPhone")))
          ')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/TresorsDeParis.app
          # Open each tab in turn and screenshot it; fail if the app crashed
          for TAB in 0 1 2 3 4; do
            xcrun simctl terminate "$DEVICE" com.tresorsdeparis || true
            xcrun simctl launch "$DEVICE" com.tresorsdeparis -startTab $TAB
            sleep 12
            xcrun simctl io "$DEVICE" screenshot "tab-$TAB.png"
            xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.tresorsdeparis
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: "*.png"
