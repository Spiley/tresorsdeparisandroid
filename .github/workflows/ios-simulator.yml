name: iOS simulator

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/TresorsDeParis.xcodeproj -scheme TresorsDeParis \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log || {
            # Surface compiler errors as annotations on the run page
            grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Boot simulator, install and launch
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")])
          iphones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          # A Pro Max has the 6.9" screen App Store Connect asks screenshots for
          print(next((d["udid"] for d in iphones if "Pro Max" in d["name"]), iphones[0]["udid"]))
          ')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          # Clean status bar for App Store screenshots
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/TresorsDeParis.app
          # Open each tab in turn and screenshot it; fail if the app crashed
          for TAB in 0 1 2 3 4; do
            xcrun simctl terminate "$DEVICE" com.tresorsdeparis || true
            xcrun simctl launch "$DEVICE" com.tresorsdeparis -startTab $TAB
            # Slow runners can still show the launch screen after 12 seconds
            sleep 20
            xcrun simctl io "$DEVICE" screenshot "tab-$TAB.png"
            xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.tresorsdeparis
          done
          # Map with the 8th arrondissement selected, in light and dark mode
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance $MODE
            xcrun simctl terminate "$DEVICE" com.tresorsdeparis || true
            xcrun simctl launch "$DEVICE" com.tresorsdeparis -startTab 1 -selectArrondissement 8
            sleep 20
            xcrun simctl io "$DEVICE" screenshot "map-selected-$MODE.png"
            xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.tresorsdeparis
          done

      # Fails (and so blocks the TestFlight upload) when the map screen is drawn empty
      - name: Check the map is drawn
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          from PIL import Image
          failed = False
          for name in ["tab-1.png", "map-selected-light.png"]:
              im = Image.open(name).convert("RGB")
              im.thumbnail((300, 650))
              pixels = list(im.getdata())
              # The light-mode map is beige/gold land: warm, light, red well above blue
              land = sum(1 for r, g, b in pixels if r >= 190 and 130 <= g <= 240 and b <= 215 and r - b >= 25)
              share = land / len(pixels)
              print(f"::notice title=Map check::{name}: {share:.0%} of the screen is map")
              if share < 0.15:
                  print(f"::error title=Map check::{name}: the map looks empty ({share:.0%} map pixels)")
                  failed = True
          raise SystemExit(1 if failed else 0)
          EOF

      # App Store Connect also asks for 13-inch iPad screenshots; never blocks the TestFlight upload
      - name: iPad screenshots
        continue-on-error: true
        run: |
          IPAD=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in devices if ".iOS-" in r), key=lambda r: [int(p) for p in r.split(".iOS-")[1].split("-")])
          print(next(d["udid"] for d in devices[ios[-1]] if d["name"].startswith("iPad Pro 13")))
          ')
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl status_bar "$IPAD" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --batteryState charged --batteryLevel 100
          xcrun simctl ui "$IPAD" appearance light
          xcrun simctl install "$IPAD" build/Build/Products/Debug-iphonesimulator/TresorsDeParis.app
          for TAB in 0 1 2; do
            xcrun simctl terminate "$IPAD" com.tresorsdeparis || true
            xcrun simctl launch "$IPAD" com.tresorsdeparis -startTab $TAB
            sleep 20
            xcrun simctl io "$IPAD" screenshot "ipad-tab-$TAB.png"
          done
          for MODE in light dark; do
            xcrun simctl ui "$IPAD" appearance $MODE
            xcrun simctl terminate "$IPAD" com.tresorsdeparis || true
            xcrun simctl launch "$IPAD" com.tresorsdeparis -startTab 1 -selectArrondissement 8
            sleep 20
            xcrun simctl io "$IPAD" screenshot "ipad-map-selected-$MODE.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: "*.png"
